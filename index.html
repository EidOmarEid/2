<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيديوهات | شركة المختار للكهرباء</title>
<!-- 🟡 إضافة أيقونة الموقع في التبويب -->
<link rel="icon" href="logo.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#0e0e0f;
  color:#d4af37;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:#0e0e0f;
  border-bottom:1px solid #d4af37;
}
.navbar a{
  color:#d4af37;
  text-decoration:none;
  margin:0 12px;
  font-weight:bold;
}
.logo img{width:45px}

/* HERO */
.hero img{
  width:100%;
  height:auto;
  object-fit:contain;
}

/* GALLERY */
.gallery{
  max-width:900px;
  margin:60px auto;
  padding:0 15px;
  display:grid;
  gap:25px;
}

/* ✅ WRAPPER بدل الضغط على الفيديو نفسه */
.video-box{
  border:1px solid #d4af37;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.video-box video{
  width:100%;
  display:block;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(12px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.lightbox.show{display:flex}

.viewer{
  position:relative;
}

/* ✅ هنا الحل بتاع الموبايل */
.viewer video{
  max-width:90vw;
  max-height:85vh;
  border-radius:16px;
  border:2px solid #d4af37;
  background:black;
}

/* NAV BUTTONS */
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:38px;
  background:rgba(0,0,0,.6);
  color:#d4af37;
  border:none;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
  z-index:1000;
}
#prev{left:10px}
#next{right:10px}

/* FOOTER */
footer{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#0e0e0f;
  border:1px solid #d4af37;
  padding:12px 18px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(212,175,55,.4);
}

footer,
footer a,
footer span{
  color:#d4af37; /* نفس اللون الذهبي */
  font-weight:bold;
}

footer a{
  text-decoration:none;   /* ✅ إزالة الخط */
}

footer a:hover{
  opacity:.85;             /* تأثير خفيف عند المرور */
}
 /*الأرقام في أسفل الصفحه*/
.pagination{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:60px 0 120px;
}

.page-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid #d4af37;
  background:#0e0e0f;
  color:#d4af37;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.page-btn:hover{
  background:#d4af37;
  color:#0e0e0f;
  transform:scale(1.15);
  box-shadow:0 0 20px rgba(212,175,55,.6);
}

.page-btn:active{
  transform:scale(.95);
}


</style>
</head>

<body>

<!-- NAV -->
<header class="navbar">
  <div class="logo"><img src="logo.png">شركة المختار للكهرباء</div>
  <nav>
    <a href="https://eidomareid.github.io/2/">الرئيسية</a>
    <a href="https://eidomareid.github.io/1/">صور</a>
  </nav>
</header>

<section class="hero" id="videos">
  <img src="hero.jpg">
</section>

<section class="gallery" id="gallery"></section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="viewer">
    <video id="player" controls playsinline></video>
    <button id="prev" class="nav-btn">&#10094;</button>
    <button id="next" class="nav-btn">&#10095;</button>
  </div>
</div>
<!-- الأرقام في أسفل الصفحه -->
<div class="pagination" id="pagination"></div>

<footer>
  <a href="https://www.facebook.com/share/1BPv1VVzUf/"> مصمم الموقع عيد عمر </a> |
  <a href="https://www.facebook.com/share/1BHrDZCB9U/">01091929924 محمود مختار</a> |
  <a href="https://www.facebook.com/share/1BoLowqAXx/">01017248680 أحمد مختار</a> |

</footer>

<script>

/* روابط الصفحات */
const pageLinks = [
  "https://eidomareid.github.io/2/",
  "https://eidomareid.github.io/1/"
];

/* إنشاء الأزرار */
const pagination = document.getElementById("pagination");

pageLinks.forEach((link, index) => {
  const btn = document.createElement("button");
  btn.className = "page-btn";
  btn.textContent = index + 1; // 1 - 2 - 3

  btn.onclick = () => {
    btn.style.transform = "scale(1.3)";
    setTimeout(() => {
      location.href = link;
    }, 200);
  };

  pagination.appendChild(btn);
});


const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const player = document.getElementById("player");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

const videoCount = 33; // ✅ عدد الفيديوهات
let videos = [];
let index = 0;

/* تحميل الفيديوهات */
for(let i=1;i<=videoCount;i++){
  const box = document.createElement("div");
  box.className="video-box";

  const v = document.createElement("video");
  v.src = `${i}.mp4`;
  v.muted = true;
  v.preload = "metadata";

  box.appendChild(v);
  box.onclick = ()=>openVideo(i-1);

  gallery.appendChild(box);
  videos.push(v.src);
}

/* فتح الفيديو */
function openVideo(i){
  index = i;
  player.pause();
  player.src = videos[i];
  player.load();
  player.play();
  lightbox.classList.add("show");
}

/* إغلاق */
lightbox.addEventListener("click",e=>{
  if(e.target === lightbox){
    player.pause();
    player.currentTime=0;
    lightbox.classList.remove("show");
  }
});

/* تنقل */
prev.onclick = e=>{
  e.stopPropagation();
  index = (index-1+videos.length)%videos.length;
  openVideo(index);
}
next.onclick = e=>{
  e.stopPropagation();
  index = (index+1)%videos.length;
  openVideo(index);
}

/* ✅ حل خاص بالموبايل */
player.addEventListener("touchstart", e=>{
  e.stopPropagation();
});
</script>


<script>
function scrollToTarget(id, duration = 900){
  const target = document.getElementById(id);
  if(!target) return;

  const start = window.pageYOffset;
  const end = target.getBoundingClientRect().top + start;
  const distance = end - start;
  let startTime = null;

  function animation(currentTime){
    if(startTime === null) startTime = currentTime;
    const timeElapsed = currentTime - startTime;
    const progress = Math.min(timeElapsed / duration, 1);

    // ✅ Ease In Out (ناعم وفخم)
    const ease = progress < .5
      ? 2 * progress * progress
      : 1 - Math.pow(-2 * progress + 2, 2) / 2;

    window.scrollTo(0, start + distance * ease);

    if(progress < 1){
      requestAnimationFrame(animation);
    }
  }
  

  

  requestAnimationFrame(animation);
}
</script>


</body>
</html>
